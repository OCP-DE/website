# Security updates: GitHub checks the building blocks of the site weekly and opens a pull
# request when an update is available. Patch and minor updates are checked and merged
# automatically (.github/workflows/security-updates.yml). Major versions are not proposed
# automatically - they are upgraded deliberately and tested by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
