# Security updates: GitHub checks the building blocks of the site weekly and opens a pull
# request when an update is available. Nothing is merged automatically - review, then merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
